name: Refresh separate Treasury market receipt
on:
  workflow_dispatch:
  schedule:
    - cron: '15 0 * * 2-6'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-core.txt
      - id: refresh
        continue-on-error: true
        run: python scripts/refresh_market.py
      - name: Save health and last-known-good receipt
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json data/health.json
          git diff --cached --quiet || git commit -m 'Refresh separate market receipt; preserve frozen study'
          git push
      - if: steps.refresh.outcome == 'failure'
        run: exit 1
